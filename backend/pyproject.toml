[project]
name = "zaincash-support"
version = "0.1.0"
description = "Topic 06 support pipeline: classify, extract, route and pre-draft Iraqi-dialect tickets"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.6.2,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openrouter>=0.1,<1",
  "langchain-typesafe==0.0.1a3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1",
  "typer>=0.12",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18",
  "httpx>=0.27,<1",
  "pypdf>=6.21.1",
  "pgvector>=0.5.1",
  "pillow>=13.0.0",
]

[project.scripts]
support = "app.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Postgres from `docker compose up -d db`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long Arabic literals and prompts; formatting is not a review gate

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
